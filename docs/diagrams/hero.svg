<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">pi-switchboard</title>
  <desc id="desc">A self-hosted relay for live Pi sessions. Discover peers, send notices, and request prompt or steering only with receiver-local consent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="55%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="1232" height="372" rx="22" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="64" y="88" fill="#94a3b8" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="18" letter-spacing="4">PI EXTENSION + ERLANG HUB</text>
  <text x="64" y="148" fill="#f8fafc" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="42" font-weight="700">A switchboard for live Pi sessions</text>
  <text x="64" y="196" fill="#cbd5e1" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="22">Discover peers. Send small messages. Prompt and steer only with consent.</text>

  <g font-family="Noto Sans, Arial, Helvetica, sans-serif">
    <rect x="64" y="236" width="280" height="88" rx="16" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text x="88" y="274" fill="#22d3ee" font-size="14" letter-spacing="2">01  REGISTER</text>
    <text x="88" y="302" fill="#f8fafc" font-size="18">Advertise the session</text>

    <rect x="372" y="236" width="280" height="88" rx="16" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text x="396" y="274" fill="#22d3ee" font-size="14" letter-spacing="2">02  DISCOVER</text>
    <text x="396" y="302" fill="#f8fafc" font-size="18">Fresh lookup, no cache</text>

    <rect x="680" y="236" width="280" height="88" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="704" y="274" fill="#34d399" font-size="14" letter-spacing="2">03  NOTICE</text>
    <text x="704" y="302" fill="#f8fafc" font-size="18">Inbox, no model turn</text>

    <rect x="988" y="236" width="228" height="88" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="1012" y="274" fill="#fbbf24" font-size="14" letter-spacing="2">04  CONSENT</text>
    <text x="1012" y="302" fill="#f8fafc" font-size="18">Prompt / steer</text>
  </g>

  <text x="64" y="364" fill="#94a3b8" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="16">Best effort. Acceptance means queued in hub memory, not delivered or executed.</text>
  <rect x="64" y="380" width="240" height="6" rx="3" fill="url(#accent)"/>
</svg>
